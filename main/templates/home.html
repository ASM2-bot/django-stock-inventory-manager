{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" crossorigin="anonymous">

  <style>
    /* Full-screen hero background */
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background: url("{% static 'images/prefecture.jpg' %}") no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5); /* dark overlay for text readability */
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .hero .btn {
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      border-radius: 50px;
      margin: 0.5rem;
    }

    .btn-primary {
      background-color: #556ee6;
      border-color: #556ee6;
    }

    .btn-primary:hover {
      background-color: #3b50b0;
      border-color: #3b50b0;
    }

    .btn-outline-light {
      border-color: #fff;
      color: #fff;
    }

    .btn-outline-light:hover {
      background-color: #fff;
      color: #333;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }
      .hero p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  {% include 'navbar.html' %}

  <section class="hero">
    <div class="hero-content">
      <h1>{{ title|default:"📦 Welcome to Inventory Management" }}</h1>
      <p>Manage your stock efficiently with real-time inventory updates and streamlined workflows.</p>
      <a href="{% url 'list_items' %}" class="btn btn-primary btn-lg">View Inventory</a>
      <a href="{% url 'add_items' %}" class="btn btn-outline-light btn-lg">Add New Item</a>
    </div>
  </section>

  <!-- Optional: Additional sections below the hero -->
  <main class="container py-5">
    <!-- Example: stats, features, etc. -->
  </main>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
