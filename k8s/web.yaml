apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-web
  template:
    metadata:
      labels:
        app: stock-web
    spec:
      containers:
        - name: web
          image: stock-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: stock-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stock-secret
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /login/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stock-web
spec:
  type: NodePort
  selector:
    app: stock-web
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
